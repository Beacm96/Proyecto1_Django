{% extends "social/base.html" %}

{% block title %}
Iniciar sesión | Red Social
{% endblock %}

{% block content %}

<section class="form-section">

    <h2>Iniciar sesión</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Entrar
        </button>

    </form>

    <p>
        ¿No tienes una cuenta?
        <a href="{% url 'register' %}">
            Regístrate
        </a>
    </p>

</section>

{% endblock %}
