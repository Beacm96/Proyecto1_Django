{% extends "social/base.html" %}

{% block title %}
Registro | Red Social
{% endblock %}

{% block content %}

<section class="form-section">

    <h2>Registro</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Registrarse
        </button>

    </form>

    <p>
        ¿Ya tienes una cuenta?
        <a href="{% url 'login' %}">
            Inicia sesión
        </a>
    </p>

</section>

{% endblock %}
