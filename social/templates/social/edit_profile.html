{% extends "social/base.html" %}

{% block title %}
Editar perfil | Red Social
{% endblock %}

{% block content %}

<section class="form-section">

    <h2>Editar perfil</h2>

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Guardar cambios
        </button>

    </form>

    <p>
        <a href="{% url 'profile' user.username %}">
            Volver a mi perfil
        </a>
    </p>

</section>

{% endblock %}
