{% extends "social/base.html" %}

{% block title %}
Nueva publicación | Red Social
{% endblock %}

{% block content %}

<section class="form-section">

    <h2>Crear publicación</h2>

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Publicar
        </button>

    </form>

</section>

{% endblock %}
